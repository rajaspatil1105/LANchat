# Render.com blueprint — deploys SimpleChat as two web services.
# Push this repo to GitHub, then in Render: New > Blueprint > pick this repo.
# After the first deploy, set the cross-service URLs:
#   * backend  ALLOWED_ORIGINS  = https://<your-frontend>.onrender.com
#   * frontend SIMPLECHAT_API_URL = https://<your-backend>.onrender.com
services:
  # ---- FastAPI backend ---------------------------------------------------- #
  - type: web
    name: simplechat-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        sync: false                # set to the frontend URL after first deploy

  # ---- Streamlit frontend ------------------------------------------------- #
  - type: web
    name: simplechat-frontend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SIMPLECHAT_API_URL
        sync: false                # set to the backend URL after first deploy
